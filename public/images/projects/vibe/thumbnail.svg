<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- Grid lines -->
  <g opacity="0.08">
    <path d="M0 157.5H1200" stroke="#000" stroke-width="1" />
    <path d="M0 315H1200" stroke="#000" stroke-width="1" />
    <path d="M0 472.5H1200" stroke="#000" stroke-width="1" />
    <path d="M300 0V630" stroke="#000" stroke-width="1" />
    <path d="M600 0V630" stroke="#000" stroke-width="1" />
    <path d="M900 0V630" stroke="#000" stroke-width="1" />
  </g>

  <!-- Main card shadow -->
  <rect x="94" y="94" width="820" height="442" fill="#000" />

  <!-- Main card -->
  <rect x="90" y="90" width="820" height="442" fill="#FFFFFF" stroke="#000" stroke-width="3" />

  <!-- Top bar -->
  <rect x="90" y="90" width="820" height="50" fill="#000" />
  <text x="110" y="122" font-family="system-ui, sans-serif" font-size="14" fill="#FFF" font-weight="600" letter-spacing="0.1em">VIBEPORTFOLIO</text>

  <!-- Content -->
  <text x="120" y="200" font-family="system-ui, sans-serif" font-size="14" fill="#666" font-weight="500" letter-spacing="0.15em">// BRUTALIST PORTFOLIO</text>

  <text x="120" y="280" font-family="system-ui, sans-serif" font-size="72" fill="#000" font-weight="900">VIBE</text>
  <text x="120" y="360" font-family="system-ui, sans-serif" font-size="72" fill="#84CC16" font-weight="900">PORTFOLIO</text>

  <text x="120" y="420" font-family="ui-monospace, monospace" font-size="16" fill="#666">Astro + React + TypeScript + Tailwind CSS</text>

  <!-- Decorative badge -->
  <g transform="translate(120, 460)">
    <rect x="4" y="4" width="140" height="40" fill="#000" />
    <rect width="140" height="40" fill="#BEF264" stroke="#000" stroke-width="2" />
    <text x="70" y="27" font-family="system-ui, sans-serif" font-size="14" fill="#000" font-weight="700" text-anchor="middle">NEO-BRUTALISM</text>
  </g>

  <!-- Side decoration -->
  <rect x="960" y="90" width="150" height="150" fill="#BEF264" />
  <rect x="960" y="240" width="150" height="150" fill="#000" />
  <rect x="960" y="390" width="150" height="142" fill="#E5E7EB" />

  <!-- Corner accent -->
  <rect x="1060" y="500" width="100" height="90" fill="#84CC16" />
</svg>