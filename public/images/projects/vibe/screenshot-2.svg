<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFFFF" />

  <!-- Browser frame shadow -->
  <rect x="54" y="54" width="1092" height="692" fill="#000" />

  <!-- Browser frame -->
  <rect x="50" y="50" width="1092" height="692" fill="#FFF" stroke="#000" stroke-width="2" />

  <!-- Browser top bar -->
  <rect x="50" y="50" width="1092" height="44" fill="#000" />
  <circle cx="78" cy="72" r="6" fill="#FFF" />
  <circle cx="98" cy="72" r="6" fill="#FFF" opacity="0.5" />
  <circle cx="118" cy="72" r="6" fill="#FFF" opacity="0.3" />
  <text x="600" y="77" font-family="ui-monospace, monospace" font-size="12" fill="#666" text-anchor="middle">vibeportfolio.dev/projects</text>

  <!-- Header -->
  <rect x="50" y="94" width="1092" height="56" fill="#FFF" />
  <text x="90" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#000" font-weight="800">VP</text>
  <path d="M50 150H1142" stroke="#E5E7EB" stroke-width="1" />

  <!-- Nav items -->
  <text x="900" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#666">首页</text>
  <text x="970" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#000" font-weight="500">项目</text>
  <text x="1040" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#666">关于</text>

  <!-- Page header -->
  <text x="90" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#666" letter-spacing="0.1em">// 项目作品</text>

  <text x="90" y="280" font-family="system-ui, sans-serif" font-size="48" fill="#000" font-weight="900">全部</text>
  <text x="230" y="280" font-family="system-ui, sans-serif" font-size="48" fill="#84CC16" font-weight="900">项目</text>

  <!-- Filter buttons -->
  <g transform="translate(90, 320)">
    <rect x="3" y="3" width="60" height="36" fill="#000" />
    <rect width="60" height="36" fill="#BEF264" stroke="#000" stroke-width="2" />
    <text x="30" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#000" font-weight="600" text-anchor="middle">全部</text>
  </g>

  <g transform="translate(170, 320)">
    <rect width="60" height="36" fill="#FFF" stroke="#000" stroke-width="1" />
    <text x="30" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#666" text-anchor="middle">网页</text>
  </g>

  <g transform="translate(245, 320)">
    <rect width="60" height="36" fill="#FFF" stroke="#000" stroke-width="1" />
    <text x="30" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#666" text-anchor="middle">后端</text>
  </g>

  <g transform="translate(320, 320)">
    <rect width="60" height="36" fill="#FFF" stroke="#000" stroke-width="1" />
    <text x="30" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#666" text-anchor="middle">全栈</text>
  </g>

  <!-- Project cards row -->
  <!-- Card 1 -->
  <g transform="translate(90, 400)">
    <rect x="4" y="4" width="320" height="280" fill="#000" />
    <rect width="320" height="280" fill="#FFF" stroke="#000" stroke-width="2" />
    <rect y="0" width="320" height="160" fill="#F5F5F5" />
    <rect x="20" y="20" width="80" height="80" fill="#BEF264" />
    <rect x="110" y="20" width="80" height="80" fill="#000" />
    <rect x="20" y="110" width="80" height="30" fill="#E5E7EB" />

    <!-- Featured badge -->
    <rect x="220" y="15" width="80" height="24" fill="#BEF264" stroke="#000" stroke-width="1" />
    <text x="260" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#000" font-weight="600" text-anchor="middle">精选</text>

    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="18" fill="#000" font-weight="700">项目标题</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#666">项目描述简介文字</text>

    <!-- Tech tags -->
    <rect x="20" y="240" width="50" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="45" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">React</text>
    <rect x="78" y="240" width="60" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="108" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(440, 400)">
    <rect x="4" y="4" width="320" height="280" fill="#000" />
    <rect width="320" height="280" fill="#FFF" stroke="#000" stroke-width="2" />
    <rect y="0" width="320" height="160" fill="#F5F5F5" />
    <rect x="20" y="20" width="120" height="60" fill="#84CC16" />
    <rect x="150" y="20" width="60" height="60" fill="#E5E7EB" />
    <rect x="20" y="90" width="60" height="50" fill="#000" />

    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="18" fill="#000" font-weight="700">另一个项目</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#666">这是项目的简短描述</text>

    <rect x="20" y="240" width="45" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="42" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">Node</text>
    <rect x="73" y="240" width="55" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="100" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">Express</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(790, 400)">
    <rect x="4" y="4" width="320" height="280" fill="#000" />
    <rect width="320" height="280" fill="#FFF" stroke="#000" stroke-width="2" />
    <rect y="0" width="320" height="160" fill="#F5F5F5" />
    <rect x="20" y="30" width="100" height="100" fill="#BEF264" />
    <rect x="140" y="30" width="100" height="100" fill="#E5E7EB" />

    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="18" fill="#000" font-weight="700">第三个项目</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#666">项目简介说明</text>

    <rect x="20" y="240" width="50" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="45" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">Astro</text>
    <rect x="78" y="240" width="55" height="22" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
    <text x="105" y="255" font-family="ui-monospace, monospace" font-size="10" fill="#666" text-anchor="middle">Tailwind</text>
  </g>
</svg>