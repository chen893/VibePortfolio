<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFFFF" />

  <!-- Browser frame shadow -->
  <rect x="54" y="54" width="1092" height="692" fill="#000" />

  <!-- Browser frame -->
  <rect x="50" y="50" width="1092" height="692" fill="#FFF" stroke="#000" stroke-width="2" />

  <!-- Browser top bar -->
  <rect x="50" y="50" width="1092" height="44" fill="#000" />
  <circle cx="78" cy="72" r="6" fill="#FFF" />
  <circle cx="98" cy="72" r="6" fill="#FFF" opacity="0.5" />
  <circle cx="118" cy="72" r="6" fill="#FFF" opacity="0.3" />
  <text x="600" y="77" font-family="ui-monospace, monospace" font-size="12" fill="#666" text-anchor="middle">vibeportfolio.dev</text>

  <!-- Header -->
  <rect x="50" y="94" width="1092" height="56" fill="#FFF" />
  <text x="90" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#000" font-weight="800">VP</text>
  <path d="M50 150H1142" stroke="#E5E7EB" stroke-width="1" />

  <!-- Nav items -->
  <text x="900" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#000" font-weight="500">首页</text>
  <text x="970" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#666">项目</text>
  <text x="1040" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#666">关于</text>

  <!-- Hero section -->
  <text x="90" y="220" font-family="system-ui, sans-serif" font-size="14" fill="#666" letter-spacing="0.1em">// HELLO WORLD</text>

  <text x="90" y="300" font-family="system-ui, sans-serif" font-size="14" fill="#666">我是</text>
  <text x="90" y="380" font-family="system-ui, sans-serif" font-size="64" fill="#000" font-weight="900">YOUR</text>
  <text x="90" y="460" font-family="system-ui, sans-serif" font-size="64" fill="#84CC16" font-weight="900">NAME</text>

  <text x="90" y="520" font-family="system-ui, sans-serif" font-size="18" fill="#666">全栈开发者 · 创造数字体验</text>

  <!-- CTA Buttons -->
  <g transform="translate(90, 560)">
    <rect x="4" y="4" width="140" height="48" fill="#000" />
    <rect width="140" height="48" fill="#BEF264" stroke="#000" stroke-width="2" />
    <text x="70" y="31" font-family="system-ui, sans-serif" font-size="14" fill="#000" font-weight="700" text-anchor="middle">查看项目</text>
  </g>

  <g transform="translate(260, 560)">
    <rect width="120" height="48" fill="#FFF" stroke="#000" stroke-width="2" />
    <text x="60" y="31" font-family="system-ui, sans-serif" font-size="14" fill="#000" font-weight="500" text-anchor="middle">关于我</text>
  </g>

  <!-- Side decoration -->
  <rect x="700" y="200" width="400" height="400" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1" />
  <rect x="750" y="250" width="120" height="120" fill="#BEF264" />
  <rect x="880" y="250" width="120" height="120" fill="#000" />
  <rect x="750" y="380" width="120" height="120" fill="#E5E7EB" />
  <rect x="880" y="380" width="120" height="120" fill="#84CC16" />

  <!-- Scroll indicator -->
  <text x="90" y="700" font-family="system-ui, sans-serif" font-size="12" fill="#999" letter-spacing="0.1em">↓ SCROLL</text>
